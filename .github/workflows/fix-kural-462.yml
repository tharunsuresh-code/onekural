name: Fix Kural 462 Tamil Explanation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-kural-462.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply explanation_tamil fix for kural 462
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('public/data/kurals.json', 'utf8'));
          const k = data.find(x => x.id === 462);

          const correct = [
            'நாம் செய்ய நினைக்கற கிளம்பு, முதலில் தெளிவாச் சிந்தித்து, நம்மை நம்பி தன்னம்பிக்கை இருக்க நல்ல மனுஷ்யங்களோடு ஆலோசனை செய்யணும். அப்படி செஞ்சாக் கடினமான வேலையே இல்ல.',
            '',
            '**தெரிந்த இனத்தொடு** — நாம் நம்பி, அறிவு இருக்கிற தெரிந்த மனுஷ்யங்கள் என்று அர்த்தம். சாதாரணமா யாருக் கூட சொல்லலாம்.',
            '**தேர்ந்தெண்ணி** — செயலை இருந்து இருந்து பாத்துக் கணக்குப் பாத்து, எதாவது தடை இருக்கா, வழி இருக்கா, பரிசோதனை பாக்கிறோம் இப்படி பொருள்.',
            '**அரும்பொருள் யாதொன்றும் இல்** — சாத்தியமில்லாத கனவு, நடக்காத பொருள் ஒன்னுமே இல்ல.',
            '',
            'எல்லாரும் ஒருத்தர் மகளைக் கல்யாணம் பண்ணணுமோ, தொழிலு தொடங்கணுமோ, பிரச்சனை சமாதானம் செய்யணுமோ — இப்படிக் கனவ வச்சவங்க, தெரிந்தவங்ககிட்ட ஆலோசிச்சு நல்லா யோசிச்சு முன்னேறினா — கடினமான ஒண்ணும் இல்ல.'
          ].join('\n');

          if (k.explanation_tamil === correct) {
            console.log('Already correct — no change needed.');
            process.exit(0);
          }
          k.explanation_tamil = correct;
          fs.writeFileSync('public/data/kurals.json', JSON.stringify(data, null, 2));
          console.log('Fixed kural 462 explanation_tamil.');
          "

      - name: Commit and push if changed
        run: |
          git config user.email "agent@onekural.com"
          git config user.name "OneKural Agent"
          git add public/data/kurals.json
          git diff --cached --quiet && echo "Nothing to commit." && exit 0
          git commit -m "fix: explanation format for kural #462"
          git push origin main
