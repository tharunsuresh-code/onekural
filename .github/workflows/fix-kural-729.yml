name: Fix Kural 729 Tamil Explanation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-kural-729.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full kurals.json if truncated, then apply fix
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');

          // Check if the current file is valid and complete
          let data;
          let fileOk = false;
          try {
            const raw = fs.readFileSync('public/data/kurals.json', 'utf8');
            data = JSON.parse(raw);
            if (data.length === 1330) fileOk = true;
          } catch(e) {
            console.log('File is truncated or invalid:', e.message);
          }

          if (!fileOk) {
            console.log('Restoring full kurals.json from last good commit...');
            // Find the last commit where the file is complete (>4MB)
            const log = execSync('git log --format=%H -- public/data/kurals.json').toString().trim().split('\n');
            let restored = false;
            for (const sha of log) {
              try {
                const size = parseInt(execSync('git cat-file -s ' + sha + ':public/data/kurals.json').toString().trim());
                console.log(sha + ': ' + size + ' bytes');
                if (size > 4000000) {
                  const content = execSync('git show ' + sha + ':public/data/kurals.json');
                  const parsed = JSON.parse(content.toString());
                  if (parsed.length === 1330) {
                    data = parsed;
                    console.log('Restored from commit: ' + sha);
                    restored = true;
                    break;
                  }
                }
              } catch(e2) {
                console.log('Skipping ' + sha + ': ' + e2.message);
              }
            }
            if (!restored) throw new Error('Could not find a good kurals.json in git history');
          }

          // Apply the fix: kural 729 explanation_tamil needs \n\n** not \n**
          const k = data.find(x => x.id === 729);
          const broken = 'குறள்.\n**கல்லாதவரின்';
          const fixed  = 'குறள்.\n\n**கல்லாதவரின்';

          if (!k.explanation_tamil.includes(broken)) {
            console.log('Kural 729 already has correct format — no change needed.');
            process.exit(0);
          }

          k.explanation_tamil = k.explanation_tamil.replace(broken, fixed);
          fs.writeFileSync('public/data/kurals.json', JSON.stringify(data, null, 2) + '\n');
          console.log('Fixed kural 729 explanation_tamil.');
          "

      - name: Commit and push if changed
        run: |
          git config user.email "agent@onekural.com"
          git config user.name "OneKural Agent"
          git add public/data/kurals.json
          git diff --cached --quiet && echo "Nothing to commit." && exit 0
          git commit -m "fix: explanation format for kural #729"
          git push origin main
