name: Fix Kural 729 Tamil Explanation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-kural-729.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore kurals.json from good commit and apply fix
        run: |
          # Find last commit with full kurals.json
          for SHA in $(git log --format='%H' -- public/data/kurals.json); do
            BYTES=$(git cat-file -s ${SHA}:public/data/kurals.json 2>/dev/null || echo 0)
            if [ "$BYTES" -gt 4000000 ]; then
              echo "Restoring from commit $SHA ($BYTES bytes)"
              git checkout $SHA -- public/data/kurals.json
              break
            fi
          done

      - name: Apply the fix
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('public/data/kurals.json', 'utf8'));
            const k = data.find(x => x.id === 729);
            const old = k.explanation_tamil;
            k.explanation_tamil = old.replace('குறள்.\n**கல்லாதவரின்', 'குறள்.\n\n**கல்லாதவரின்');
            if (k.explanation_tamil === old) { console.log('Already fixed.'); process.exit(0); }
            fs.writeFileSync('public/data/kurals.json', JSON.stringify(data, null, 2) + '\n');
            console.log('Fixed kural 729.');
          "

      - name: Commit and push
        run: |
          git config user.email "agent@onekural.com"
          git config user.name "OneKural Agent"
          git add public/data/kurals.json
          git diff --cached --quiet && echo "Nothing to commit." && exit 0
          git commit -m "fix: explanation format for kural #729"
          git push origin main
