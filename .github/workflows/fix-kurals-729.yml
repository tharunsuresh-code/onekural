name: One-shot fix kurals 729
on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if kurals.json needs fixing
        id: check
        run: |
          FILE_SIZE=$(wc -c < public/data/kurals.json)
          echo "File size: $FILE_SIZE bytes"
          if [ $FILE_SIZE -gt 4000000 ]; then
            echo "File already correct size, checking content..."
            python3 -c "
import json, sys
with open('public/data/kurals.json') as f:
    d = json.load(f)
k729 = next(k for k in d if k['id'] == 729)
et = k729['explanation_tamil']
if '\\n\\n**' in et:
    print('ALREADY_FIXED')
    sys.exit(0)
else:
    print('NEEDS_FIX')
    sys.exit(1)
" && echo "needs_fix=false" >> $GITHUB_OUTPUT || echo "needs_fix=true" >> $GITHUB_OUTPUT
          else
            echo "File is corrupt/truncated, needs fix"
            echo "needs_fix=true" >> $GITHUB_OUTPUT
          fi
      - name: Restore correct kurals.json from git history
        if: steps.check.outputs.needs_fix == 'true'
        run: |
          # Find first commit where kurals.json is > 4MB (the correct full file)
          FOUND=false
          for sha in $(git log --format="%H" -- public/data/kurals.json); do
            SIZE=$(git show ${sha}:public/data/kurals.json | wc -c)
            echo "$sha: $SIZE bytes"
            if [ $SIZE -gt 4000000 ]; then
              echo "Found correct commit: $sha ($SIZE bytes)"
              git checkout ${sha} -- public/data/kurals.json
              FOUND=true
              break
            fi
          done
          if [ "$FOUND" = "false" ]; then
            echo "ERROR: Could not find a commit with the correct kurals.json"
            exit 1
          fi
      - name: Verify and commit the fix
        if: steps.check.outputs.needs_fix == 'true'
        run: |
          FILE_SIZE=$(wc -c < public/data/kurals.json)
          echo "File size after fix: $FILE_SIZE bytes"
          python3 -c "
import json
with open('public/data/kurals.json') as f:
    d = json.load(f)
print(f'{len(d)} kurals')
k729 = next(k for k in d if k['id'] == 729)
et = k729['explanation_tamil']
idx = et.find('**')
print('Before first **: ' + repr(et[max(0,idx-5):idx+10]))
"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/data/kurals.json
          git commit -m "fix: restore correct kurals.json with proper explanation format for kural #729"
          git push
